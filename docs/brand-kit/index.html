<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Grace Community Church · Brand Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root {
    --brand-green: #2D5A3D;
    --brand-deep: #1F3D2A;
    --surface: #D5DCD0;
    --paper: #F8F5EE;
    --brand-accent: #C97B5C;
    --ink: #1A1F1B;
    --ink-soft: #1A1F1B99;
    --brand-display: 'Playfair Display', serif;
    --brand-body: 'Source Sans 3', sans-serif;
    --brand-mono: 'JetBrains Mono', monospace;
  }
  html, body {
    margin: 0; padding: 0;
    background: #F2F0EA;
    font-family: var(--brand-body);
    color: var(--ink);
  }
  /* italics in Playfair are nicer */
  em { font-style: italic; }

  /* ── Canvas lock ──────────────────────────────────────────────
     Hides the drag/reorder/delete/inline-rename affordances on
     the design canvas so the layout can only be changed via prompt.
     Comment this block out (or remove the .canvas-locked class)
     to re-enable direct manipulation. */
  .canvas-locked .dc-grip,
  .canvas-locked .dc-btns { display: none !important; }
  .canvas-locked .dc-editable {
    pointer-events: none !important;
    cursor: default !important;
  }
  .canvas-locked .dc-labeltext { cursor: default !important; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</head>
